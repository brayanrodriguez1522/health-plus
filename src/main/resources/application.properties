spring.application.name=healthplus

# ================== SERVIDOR ==================
# Puerto: en tu computador 8080; en Render, el que el servidor indique en la variable PORT.
server.port=${PORT:8080}
# En internet la app está detrás de un "proxy" con https: esto hace que Spring arme bien
# las direcciones (por ejemplo la de regreso de Google: https://.../login/oauth2/code/google).
server.forward-headers-strategy=framework

# ================== BASE DE DATOS (H2 en archivo) ==================
# Los datos se guardan en la carpeta ./data del proyecto (archivo healthplus.mv.db).
# Si borras esa carpeta con la app apagada, la base de datos se crea de nuevo vacía.
spring.datasource.url=jdbc:h2:file:./data/healthplus;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
# "update" = Hibernate crea/actualiza las tablas a partir de las clases @Entity (carpeta modelo)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web para VER y LIMPIAR la base de datos: http://localhost:8080/h2-console
#   JDBC URL: jdbc:h2:file:./data/healthplus;AUTO_SERVER=TRUE   Usuario: sa   Contraseña: (vacía)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ================== SECRETOS (correo, Google, Facebook) ==================
# Las contraseñas NO se escriben aquí (este archivo se sube a GitHub).
# Van en "secretos.properties" (al lado de pom.xml), que está en .gitignore.
# Copia "secretos.properties.ejemplo", renómbralo y llena tus datos. Si no existe, la app igual arranca:
#   - el código de verificación se muestra en la consola y en pantalla (modo prueba)
#   - los botones de Google/Facebook avisan que falta configurarlos
# En internet (Render) el mismo archivo se sube como "Secret File" y queda en /etc/secrets/
spring.config.import=optional:file:./secretos.properties,optional:file:/etc/secrets/secretos.properties

# Si el servidor de correo no responde en 10 segundos, se deja de esperar y se usa el modo prueba
# (sin esto, el registro podría quedarse "cargando" para siempre)
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Datos de la app (se usan en el correo y en el registro)
healthplus.codigo.minutos-validez=10
healthplus.codigo.max-intentos=5

# Que los errores de plantillas se vean claros mientras desarrollamos
spring.thymeleaf.cache=false
